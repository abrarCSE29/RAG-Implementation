services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  api:
    build: .
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # These act as fallbacks if missing in .env
      APP_NAME: Production RAG
      APP_VERSION: 1.0.0
      ENVIRONMENT: docker
      API_KEY: ${API_KEY:-dev-api-key}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-google/flan-t5-base}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface

volumes:
  qdrant_storage:
  hf_cache:
